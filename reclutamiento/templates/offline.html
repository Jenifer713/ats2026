<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión — ATS Recluta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .offline-card {
      max-width: 420px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.10);
    }
    .offline-icon {
      font-size: 5rem;
      color: #0d6efd;
      opacity: .7;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="offline-card bg-white p-5 text-center">
    <div class="offline-icon mb-3">
      <i class="bi bi-wifi-off"></i>
    </div>
    <h4 class="fw-bold mb-2">Sin conexión a internet</h4>
    <p class="text-muted mb-4">
      No se puede conectar al servidor. Verificá tu conexión y volvé a intentarlo.
    </p>
    <button onclick="window.location.reload()" class="btn btn-primary px-4">
      <i class="bi bi-arrow-clockwise me-2"></i>Reintentar
    </button>
    <div class="mt-4 pt-3 border-top">
      <small class="text-muted">
        <i class="bi bi-people-fill text-primary me-1"></i>
        <strong>ATS Recluta</strong> — Sistema de Reclutamiento
      </small>
    </div>
  </div>
</body>
</html>
