<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - ATS Recluta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a1d23 0%, #2d3038 50%, #1a1d23 100%); min-height: 100vh; }
    .login-card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .login-header { background: linear-gradient(135deg, #0d6efd, #0a58ca); border-radius: 16px 16px 0 0; }
    .btn-login { background: linear-gradient(135deg, #0d6efd, #0a58ca); border: none; }
    .btn-login:hover { background: linear-gradient(135deg, #0a58ca, #084298); }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="container" style="max-width: 420px;">
  <div class="login-card card">
    <!-- Header -->
    <div class="login-header p-4 text-center text-white">
      <i class="bi bi-people-fill" style="font-size: 2.5rem;"></i>
      <h4 class="mt-2 mb-0 fw-bold">ATS Recluta</h4>
      <p class="small opacity-75 mb-0">Sistema de Reclutamiento</p>
    </div>

    <!-- Body -->
    <div class="card-body p-4">
      <h5 class="text-center mb-4 text-muted">Inicia sesión para continuar</h5>

      {% if form.errors %}
        <div class="alert alert-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>
          Usuario o contraseña incorrectos. Inténtalo nuevamente.
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">
            <i class="bi bi-person me-1"></i> Usuario
          </label>
          <input type="text" name="username" class="form-control form-control-lg"
                 placeholder="Nombre de usuario" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">
            <i class="bi bi-lock me-1"></i> Contraseña
          </label>
          <input type="password" name="password" class="form-control form-control-lg"
                 placeholder="Contraseña" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-login btn-primary btn-lg w-100 text-white fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar
        </button>
      </form>
    </div>

    <div class="card-footer text-center text-muted small py-3 bg-light">
      <i class="bi bi-shield-check me-1"></i> Acceso protegido — Solo personal autorizado
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
