services:
  # Servicio web principal (Django + Gunicorn)
  - type: web
    name: ats2626
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn ats2626.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render genera una clave segura automáticamente
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "True"
      - key: ALLOWED_HOSTS
        value: ""                    # Render lo rellena con RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: ats2626-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

# Base de datos PostgreSQL en Render (plan gratuito disponible)
databases:
  - name: ats2626-db
    databaseName: ats2626
    user: ats2626_user
    plan: free                       # Plan gratuito de Render (90 días)
